name: Windows EXE Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "httpx>=0.27,<1" "keyring>=25,<27" "filelock>=3.14,<4"
      - name: Compile Python source
        run: python -m compileall -q lumavun tests main.py mcp_entry.py
      - name: Test order guards and provider parsing
        run: python -m pytest -q

  build-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Build desktop dashboard EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LUMAVUN-Trade-Server
          --collect-all keyring --collect-all mcp --collect-all MetaTrader5
          main.py
      - name: Build console MCP stdio EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name Lumavun-MT5-MCP
          --collect-all keyring --collect-all mcp --collect-all MetaTrader5
          mcp_entry.py
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Lumavun-Trade-Server-Windows
          path: |
            dist/LUMAVUN-Trade-Server.exe
            dist/Lumavun-MT5-MCP.exe
          if-no-files-found: error
          retention-days: 30

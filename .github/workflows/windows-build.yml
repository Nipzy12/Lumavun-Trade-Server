name: Windows EXE Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "httpx>=0.27,<1" "keyring>=25,<27" "filelock>=3.14,<4" "numpy>=1.26.4,<2" "mcp>=1.28,<2" "uvicorn>=0.30,<1"
      - name: Compile Python source
        run: python -m compileall -q lumavun tests main.py mcp_entry.py gateway_entry.py
      - name: Test order guards and provider parsing
        run: python -m pytest -q

  build-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7" "pillow>=10,<12"
      - name: Generate premium LUMAVUN Windows icon
        run: python scripts/build_icon.py
      - name: Verify native MT5 import BEFORE bundling
        run: >
          python -c "import numpy; import MetaTrader5; print('NumPy', numpy.__version__, 'MT5', MetaTrader5.__version__)"
      - name: Build desktop dashboard EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LUMAVUN-Trade-Server
          --collect-all keyring --collect-all numpy --collect-all MetaTrader5
          --hidden-import mcp.client.streamable_http
          --icon assets/lumavun.ico
          --add-data "assets/lumavun.ico;assets"
          --add-data "assets/lumavun.png;assets"
          main.py
      - name: Build console MCP stdio EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name Lumavun-MT5-MCP
          --collect-all keyring --collect-all numpy --collect-all MetaTrader5
          --hidden-import mcp.server.fastmcp
          mcp_entry.py
      - name: Build authenticated HTTP MCP Gateway EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name Lumavun-MT5-Gateway
          --collect-all keyring --collect-all numpy --collect-all MetaTrader5
          --hidden-import mcp.server.fastmcp --hidden-import uvicorn
          gateway_entry.py
      - name: Smoke test packaged dashboard MT5 imports
        run: python tests/windows_smoke.py dist/LUMAVUN-Trade-Server.exe
      - name: Smoke test packaged dashboard native MCP client
        run: python tests/windows_smoke.py dist/LUMAVUN-Trade-Server.exe native-mcp
      - name: Smoke test Office UI (frozen EXE + actual widget render)
        run: python tests/windows_office_smoke.py dist/LUMAVUN-Trade-Server.exe
      - name: Smoke test premium GUI across six tabs and compact viewport
        run: python tests/windows_premium_smoke.py dist/LUMAVUN-Trade-Server.exe
      - name: Smoke test packaged MCP MT5 imports
        run: python tests/windows_smoke.py dist/Lumavun-MT5-MCP.exe
      - name: Smoke test packaged HTTP Gateway MT5 imports
        run: python tests/windows_smoke.py dist/Lumavun-MT5-Gateway.exe
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Lumavun-Trade-Server-Windows
          path: |
            dist/LUMAVUN-Trade-Server.exe
            assets/lumavun.png
            assets/lumavun.ico
            dist/Lumavun-MT5-MCP.exe
            dist/Lumavun-MT5-Gateway.exe
            dist/trading-office-preview.png
            dist/premium-*-preview.png
          if-no-files-found: error
          retention-days: 30
